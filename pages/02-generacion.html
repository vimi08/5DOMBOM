      crossorigin="anonymous"
    />

    <title>Ejercicio 2 - Generaciones</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
          <a class="navbar-brand text-success fw-bold" href="../index.html"

            aria-label="Toggle navigation"

            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuTP5">
            <div class="navbar-nav ms-auto">
              <a class="nav-link" href="./01-magicos.html"
                >Números Mágicos</a

                >Temporizador</a
              >
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main id="hero">
      <div class="container mt-5">
        <div class="card shadow-lg">
          <div class="card-header text-center bg-primary text-white">
            <h2>Ejercicio 2 - Generaciones</h2>
          </div>
          <div class="card-body">
            <form id="formPersona" class="row g-3">
              <div class="col-md-6">
                <label for="nombre" class="form-label">Nombre</label>
                <input
                  type="text"
                  id="nombre"
                  class="form-control"
                  placeholder="Ej: Juan"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="apellido" class="form-label">Apellido</label>
                <input
                  type="text"
                  id="apellido"
                  class="form-control"
                  placeholder="Ej: Pérez"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="dni" class="form-label">DNI</label>
                <input
                  type="text"
                  id="dni"
                  class="form-control"
                  placeholder="Ej: 12345678"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="sexo" class="form-label">Sexo</label>
                <select id="sexo" class="form-select">
                  <option value="H">Hombre</option>
                  <option value="M">Mujer</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="peso" class="form-label">Peso (kg)</label>
                <input
                  type="number"
                  id="peso"
                  class="form-control"
                  placeholder="Ej: 70"
                />
              </div>
              <div class="col-md-6">
                <label for="altura" class="form-label">Altura (cm)</label>
                <input
                  type="number"
                  id="altura"
                  class="form-control"
                  placeholder="Ej: 175"
                />
              </div>
              <div class="col-md-12">
                <label for="fechaNacimiento" class="form-label"
                  >Fecha de nacimiento</label
                >
                <input
                  type="date"
                  id="fechaNacimiento"
                  class="form-control"
                  required
                />
              </div>
              <div class="col-12 text-center mt-3">
                <button type="button" class="btn btn-primary w-50">
                  Crear Persona
                </button>
              </div>
            </form>
            <!-- Botones -->
            <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
              <button id="btnGeneracion" class="btn btn-info">
                Mostrar Generación
              </button>
              <button id="btnMayorEdad" class="btn btn-warning">
                Es Mayor de Edad?
              </button>
              <button id="btnDatos" class="btn btn-success">
                Mostrar Datos
              </button>
            </div>

            <!-- Resultado -->
            <div id="resultado" class="mt-4"></div>
          </div>
        </div>
      </div>
    </main>

    <footer class="text-center mt-5 mb-3">

    ></script>
