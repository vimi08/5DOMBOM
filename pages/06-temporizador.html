<html lang="es" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link

      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Ejercicio 6 - Temporizador</title>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
        <div class="container-fluid">
          <a class="navbar-brand text-success fw-bold" href="../index.html"
            >DOM y BOM</a
          >
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuTP5"
            aria-controls="menuTP5"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <div class="collapse navbar-collapse" id="menuTP5">
            <div class="navbar-nav ms-auto">
              <a class="nav-link" href="./01-magicos.html">Números Mágicos</a>
              <a class="nav-link" href="./02-generacion.html">Generaciones</a>
              <a class="nav-link" href="./03-listaTareas.html"
                >Lista de Tareas</a
              >
              <a class="nav-link active" href="./04-reloj.html">Reloj</a>
              <a class="nav-link" href="./05-cronometro.html">Cronómetro</a>
              <a class="nav-link" href="./06-temporizador.html">Temporizador</a>
            </div>
          </div>
        </div>
      </nav>
    </header>
    <main
      id="hero"
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div
        class="card shadow-lg p-5 text-center border-0 rounded-4 text-light bg-dark bg-opacity-75"
        id="card"
      >
        <h2 class="display-3 text-light mb-4">Temporizador</h2>
        <p class="lead">Elige tu tiempo desde los botones de acceso rápido</p>
        <div class="display-1 fw-bold mb-4" id="timer">
          <span id="horas">00</span> : <span id="minutos">00</span> :
          <span id="segundos">00</span>
        </div>
        <div class="d-flex justify-content-center flex-wrap gap-2 mb-4">
          <button class="btn btn-outline-info btn-preset" data-segundos="60">
            +1 min
          </button>
          <button class="btn btn-outline-info btn-preset" data-segundos="600">
            +10 min
          </button>
          <button class="btn btn-outline-info btn-preset" data-segundos="1800">
            +30 min
          </button>
          <button class="btn btn-outline-info btn-preset" data-segundos="3600">
            +1 hora
          </button>
        </div>
        <div class="d-flex justify-content-center gap-3">
          <button
            id="btnIniciar"
            class="btn p-3 bg-transparent text-success border border-success"
            title="Iniciar"
          >
            <i class="bi bi-play-fill fs-3"></i>
          </button>
          <button
            id="btnPausar"
            class="btn p-3 bg-transparent text-warning border border-warning"
            title="Pausar"
            disabled
          >
            <i class="bi bi-pause-fill fs-3"></i>
          </button>
          <button
            id="btnReset"
            class="btn p-3 bg-transparent text-danger border border-danger"
            title="Reset"
            disabled
          >
            <i class="bi bi-arrow-counterclockwise fs-3"></i>
          </button>
        </div>
      </div>
    </main>
    <footer class="text-center mt-5 mb-3">
      <small>&copy; 2026 - Victoria Micaela Ponce</small>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/06-temporizador.js"></script>
  </body>
</html>
